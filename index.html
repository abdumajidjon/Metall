<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTEGNITY - Strategy-First Influencer Agency</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts - Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- Hero Section -->
    <div class="hero-section" id="hero">
        <div class="hero-background">
            <!-- Statue Image -->
            <div class="statue-container">
                <img src="statue.jpg" alt="Classical Statue" class="statue-image" id="statue">
            </div>
            
            <!-- Gradient Overlay -->
            <div class="gradient-overlay"></div>
        </div>
        
        <div class="container-fluid px-0">
            <!-- Navigation -->
            <nav class="navbar navbar-expand-lg navbar-dark py-4" id="navbar">
                <div class="container-fluid px-4 px-lg-5">
                    <!-- Brand -->
                    <div class="navbar-brand-wrapper">
                        <a class="navbar-brand integnity-brand" href="#" id="brand">INTEGNITY</a>
                    </div>
                    
                    <!-- Mobile Toggle -->
                    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" id="mobileToggle">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    
                    <!-- Navigation Menu -->
                    <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                        <ul class="navbar-nav nav-center" id="navMenu">
                            <li class="nav-item">
                                <a class="nav-link active" href="#" data-nav="home">
                                    <span>HOME</span>
                                    <div class="nav-indicator"></div>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" data-nav="about">ABOUT</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" data-nav="work">WORK</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" data-nav="insights">INSIGHTS</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" data-nav="services">SERVICES</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" data-nav="contact">CONTACT</a>
                            </li>
                        </ul>
                    </div>
                    
                    <!-- CTA Button -->
                    <div class="navbar-cta d-none d-lg-block">
                        <button class="btn btn-cta" id="ctaButton">
                            <span>START A PROJECT</span>
                            <svg class="cta-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M1 8H15M15 8L8 1M15 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </nav>
            
            <!-- Hero Content -->
            <div class="hero-content" id="heroContent">
                <div class="container-fluid px-4 px-lg-5">
                    <!-- Hero Badges -->
                    <div class="row justify-content-start mb-5">
                        <div class="col-12">
                            <div class="hero-badges" id="heroBadges">
                                <div class="hero-badge" data-badge="strategy">
                                    <span>STRATEGY-FIRST<br>INFLUENCER AGENCY</span>
                                </div>
                                <div class="hero-badge" data-badge="independent">
                                    <span>INDEPENDENT<br>SINCE 2013</span>
                                </div>
                                <div class="hero-badge" data-badge="ranked">
                                    <span>#1 RANKED<br>EMERCE100</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Hero Title -->
                    <div class="row">
                        <div class="col-12">
                            <div class="hero-title-container" id="heroTitle">
                                <h1 class="hero-title">
                                    <span class="title-letter" data-letter="I">I</span>
                                    <span class="title-letter" data-letter="N">N</span>
                                    <span class="title-letter" data-letter="T">T</span>
                                    <span class="title-letter" data-letter="E">E</span>
                                    <span class="title-letter" data-letter="G">G</span>
                                    <span class="title-letter" data-letter="N">N</span>
                                    <span class="title-letter" data-letter="I">I</span>
                                    <span class="title-letter" data-letter="T">T</span>
                                    <span class="title-letter" data-letter="Y">Y</span>
                                </h1>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Scroll Indicator -->
        <div class="scroll-indicator" id="scrollIndicator">
            <div class="scroll-line"></div>
            <div class="scroll-text">SCROLL</div>
        </div>
    </div>
    
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="loading-logo">INTEGNITY</div>
            <div class="loading-progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>

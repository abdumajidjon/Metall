<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTEGNITY - Strategy-First Influencer Agency</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts - Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- Hero Section -->
    <div class="hero-section">
        <div class="container-fluid px-0">
            <!-- Navigation -->
            <nav class="navbar navbar-expand-lg navbar-dark py-4">
                <div class="container-fluid px-5">
                    <!-- Brand -->
                    <div class="navbar-brand-wrapper">
                        <a class="navbar-brand integnity-brand" href="#">INTEGNITY</a>
                    </div>
                    
                    <!-- Mobile Toggle -->
                    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    
                    <!-- Navigation Menu -->
                    <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                        <ul class="navbar-nav nav-center">
                            <li class="nav-item">
                                <a class="nav-link active" href="#">
                                    <span>HOME</span>
                                    <div class="nav-indicator"></div>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">ABOUT</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">WORK</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">INSIGHTS</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">SERVICES</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">CONTACT</a>
                            </li>
                        </ul>
                    </div>
                    
                    <!-- CTA Button -->
                    <div class="navbar-cta d-none d-lg-block">
                        <button class="btn btn-cta">START A PROJECT</button>
                    </div>
                </div>
            </nav>
            
            <!-- Hero Content -->
            <div class="hero-content">
                <div class="container-fluid px-5">
                    <!-- Hero Badges -->
                    <div class="row justify-content-center mb-5">
                        <div class="col-12">
                            <div class="hero-badges d-flex justify-content-center flex-wrap gap-4">
                                <div class="hero-badge">
                                    <span>Strategy-first<br>Influencer Agency</span>
                                </div>
                                <div class="hero-badge">
                                    <span>independent<br>since 2013</span>
                                </div>
                                <div class="hero-badge">
                                    <span>#1 Ranked<br>Emerce100</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Hero Title -->
                    <div class="row justify-content-center">
                        <div class="col-12">
                            <div class="hero-title-wrapper">
                                <div class="hero-title-bg"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>

</html>
